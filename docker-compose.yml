services:
  ai-pipeline:
    container_name: ai-pipeline
    # image:
    build: ./ai-pipeline/.devcontainer
    volumes:
      - ./ai-pipeline:/app
    user: vscode
    working_dir: /app
    command: sleep infinity
    networks:
      - network
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=agent_mongo_db
      - MONGO_DB_USERNAME=agent_mongo_user
      - MONGO_DB_PASSWORD=mongo_dev_password_123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - LANGUAGE_MODEL=gpt-5-nano
      - LANGUAGE_MODEL_BASE_URL=https://api.openai.com/v1
      - LANGUAGE_MODEL_API_KEY=${LANGUAGE_MODEL_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=redis_dev_password_123
    # depends_on:
    # ports:

  backend:
    container_name: backend
    # image:
    build: ./backend/.devcontainer
    volumes:
      - ./backend:/app
    user: vscode
    working_dir: /app
    command: sleep infinity
    networks:
      - network
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=agent_mongo_db
      - MONGO_DB_USERNAME=agent_mongo_user
      - MONGO_DB_PASSWORD=mongo_dev_password_123
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=redis_dev_password_123
    # depends_on:
    ports:
      - "8000:8000"

  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - network

  mongo:
    image: mongo:8.3.11-noble
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/var/lib/mongo/data
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - network

  redis:
    image: redis:8.10.1
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis_dev_password_123"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - network

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data:

networks:
  network:

