<textarea
  #field
  rows="1"
  aria-label="Compose message"
  placeholder="Message… (Shift+Enter for a new line)"
  class="field-sizing-content max-h-40 min-h-9 flex-1 resize-none bg-transparent px-2 py-1.5 leading-relaxed text-slate-800 placeholder:text-slate-400 focus:outline-none disabled:cursor-not-allowed"
  [value]="composer().draft"
  [disabled]="isDisabled()"
  (input)="onInput(field.value)"
  (keydown)="onKeydown($event)"
></textarea>
<button
  type="button"
  aria-label="Send"
  class="flex size-9 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:bg-slate-300"
  [disabled]="!canSubmit()"
  (click)="onSubmit()"
>
  @if (isSubmitting()) {
    <span class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
  } @else {
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25">
      <path d="M12 19V5m0 0-6 6m6-6 6 6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  }
</button>
@if (composer().error) {
  <p class="mt-1 w-full text-xs text-red-600">{{ composer().error }}</p>
}
